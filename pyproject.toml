[project]
name = "ontic-pages"
version = "0.1.0"
description = "Simple HTML hosting for the Ontic Labs team"
readme = "README.md"
authors = [
    { name = "Mikel Zhobro", email = "mikel@onticlabs.io" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.108",
    "latex2mathml>=3.81.1",
    "markdown-it-py[linkify]>=4.2.0",
    "mdit-py-plugins>=0.6.1",
]

[project.scripts]
ontic-pages = "ontic_pages.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
